[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voztudio"
version = "0.1.0"
description = "Local voice cloning wrapper with Qwen3-TTS, VoxCPM2, and Fish Speech"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "gradio>=5,<7",
  "huggingface_hub>=0.34,<2",
  "python-dotenv>=1,<2",
  "httpx>=0.27,<1",
  "msgpack>=1.0,<2",
  "numpy>=2.0.2,<3",
  "python-multipart>=0.0.9,<1",
  "soundfile>=0.12,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
